# popx simulation configuration
# Lines starting with '#' are comments.
# Per-generation override syntax: key@N = value  (activates from generation N onwards)

# -------------------------------------------------------
# Neural network layer sizes
# -------------------------------------------------------
brain_size_s = 49       # glucose 33..36; directional DANGER/MATE/HOME 37..48; slot 32 reserved
brain_size_n = 16       # hidden layer width (all hidden layers share this size)
brain_size_y = 21       # actions 0..20; 23 also enables KILL_FORWARD at 22 (21 reserved)
brain_num_hidden_layers = 4  # number of hidden layers (1-6)

# -------------------------------------------------------
# Simulation
# -------------------------------------------------------
map_size = 120
max_duration_minutes = 0  # simulated minutes; 0 = unlimited
gui_fps = 30
population           = 80
steps_per_generation = 300
max_generations      = 200000
num_threads          = 4  # maximum concurrency for sense/think (1 = serial)

# -------------------------------------------------------
# Genome
# -------------------------------------------------------
genome_min_length = 100
genome_max_length = 700
genome_source_index_count = 0  # 0: max(input width, hidden width); otherwise indices 0..count-1
genome_sink_index_count = 0    # 0: max(output width, hidden width); applies to mutations too

# -------------------------------------------------------
# Mutation / reproduction
# -------------------------------------------------------
point_mutation_rate          = 0.01  # whole-gene replacement; reduced from 0.05
gene_insertion_deletion_rate = 0.0
deletion_ratio               = 0.5
sexual_reproduction          = true
choose_parents_by_fitness    = true
hebbian_inheritance          = true  # if true, offspring inherit Hebbian-learned weights
max_reproducers_per_tick     = 3     # hard cap of reproduction attempts processed per tick
max_repro_backlog            = 64    # bounded FIFO queue for pending reproducers
forced_repro_priority_per_tick = 1   # extra reproduction budget when alive < MinPopulationAllowed

# -------------------------------------------------------
# Output directories (relative to the build/run directory)
# -------------------------------------------------------
brain_serialization_enabled = false  # deprecated; snapshots are saved manually from the dashboard
nnets_dir = ../data_out/nnets/
log_dir   = ../data_out/logs/
image_dir = ../data_out/images/

# -------------------------------------------------------
# Physiology
# -------------------------------------------------------
phy_init_mitochondrions_max = 25     # max mitochondria count at init (random 1..N)
phy_init_chloroplasts_max   = 25      # max chloroplasts count at init (random 0..N)
phy_init_sensitiveness_max  = 6      # max sensitiveness at init (random 1..N)
phy_adipose_stock_max       = 80     # max lipid storage capacity
phy_min_chloroplasts        = 10      # minimum chloroplasts required for photosynthesis
phy_max_chloroplasts_ref    = 14      # reference for photosynthesis probability scaling
phy_energy_per_respiration  = 0.3   # maximum useful energy per completed reaction
phy_heat_per_respiration    = 0.3   # heat per completed respiration reaction
phy_respiration_energy_target = 100.0 # reserve set point, not free energy
phy_respiration_demand_band   = 25.0  # full demand at target-band; zero at target
phy_alpha_min               = 0.01  # min thermal exchange coefficient (insulated by lipids)
phy_alpha_max               = 0.5   # max thermal exchange coefficient (no lipids)
phy_max_lipids_ref          = 80.0  # lipid reference for thermal insulation formula
phy_init_temperature        = 25.0  # initial body temperature (Celsius)
phy_opt_temperature         = 37.0  # optimal body temperature for respiration efficiency
phy_photo_min_elevation     = 30.0  # minimum cell elevation for light condition (photosynthesis)
phy_efficiency_half_range_c = 10.0  # respiration yield half-width and hot cutoff offset; reward keeps linear band

# -------------------------------------------------------
# New generation controls
# -------------------------------------------------------
newgen_enabled         = true   # if true, run natural selection periodically
newgen_interval_ticks  = 50000    # periodic trigger interval
newgen_survival_ratio  = 0.9    # was 0.35. Greater value is a loose natural selection [ratio of pop  kept after selection]
newgen_min_survivors   = 8       # lower bound for survivors
