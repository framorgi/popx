# popx simulation configuration
# Lines starting with '#' are comments.
# Per-generation override syntax: key@N = value  (activates from generation N onwards)

# -------------------------------------------------------
# Neural network layer sizes
# -------------------------------------------------------
brain_size_s = 57       # 24..27: four pheromone densities; 32: last move failed; 49..56: passable directions
brain_size_n = 8  # hidden layer width (all hidden layers share this size)
brain_size_y = 22       # actions 0..20 plus DO_NOTHING at 21; 23 also enables KILL_FORWARD at 22
brain_num_hidden_layers = 5  # number of hidden layers (1-6)

# -------------------------------------------------------
# Simulation
# -------------------------------------------------------
map_size = 180
source_count = 2                  # physical Source agents; spawned randomly
source_move_interval_ticks = 40  # 4x slower than the previous 10-tick path
source_glucose_interval_ticks = 40  # independent glucose emission period
source_glucose_per_neighbor = 8  # units offered to each adjacent cell; overflow floods outward
max_duration_minutes = 0  # simulated minutes; 0 = unlimited
database_limit_gb = 10
gui_fps = 30
population           = 80
max_population_allowed = 360  # cap dei Pop vivi; modificabile dalla dashboard
offspring_dispersal_radius = 2  # seconda corona solo quando tutte le 8 celle immediate sono indisponibili
steps_per_generation = 300
max_generations      = 200000
num_threads          = 4  # maximum concurrency for sense/think (1 = serial)

# -------------------------------------------------------
# Genome
# -------------------------------------------------------
genome_min_length = 100
genome_max_length = 900
genome_source_index_count = 0  # 0: max(input width, hidden width); otherwise indices 0..count-1
genome_sink_index_count = 0    # 0: max(output width, hidden width); applies to mutations too

# -------------------------------------------------------
# Mutation / reproduction
# -------------------------------------------------------
point_mutation_rate          = 0.01  # whole-gene replacement; reduced from 0.05
gene_insertion_deletion_rate = 0.0
deletion_ratio               = 0.5
sexual_reproduction          = true
choose_parents_by_fitness    = true
hebbian_inheritance          = true  # if true, offspring inherit Hebbian-learned weights
max_reproducers_per_tick     = 3     # hard cap of reproduction attempts processed per tick
max_repro_backlog            = 64    # bounded FIFO queue for pending reproducers
forced_repro_priority_per_tick = 1   # legacy, inactive: low population no longer forces births

# -------------------------------------------------------
# Output directories (relative to the build/run directory)
# -------------------------------------------------------
brain_serialization_enabled = false  # deprecated; snapshots are saved manually from the dashboard
nnets_dir = ../data_out/nnets/
log_dir   = ../data_out/logs/
image_dir = ../data_out/images/

# -------------------------------------------------------
# Physiology
# -------------------------------------------------------
phy_init_mitochondrions_max = 25     # max mitochondria count at init (random 1..N)
phy_init_chloroplasts_max   = 25      # max chloroplasts count at init (random 0..N)
phy_init_sensitiveness_max  = 6      # raggio sensoriale ereditato alla nascita (1..N)
phy_adipose_stock_max       = 80     # max lipid storage capacity
phy_min_chloroplasts        = 5  # minimum chloroplasts required for photosynthesis
phy_max_chloroplasts_ref    = 14      # reference for photosynthesis probability scaling
phy_energy_per_respiration  = 0.3   # maximum useful energy per completed reaction
phy_heat_per_respiration    = 0.3   # heat per completed respiration reaction
phy_respiration_energy_target = 100.0 # reserve set point, not free energy
phy_respiration_demand_band   = 25.0  # full demand at target-band; zero at target
phy_alpha_min               = 0.01  # min thermal exchange coefficient (insulated by lipids)
phy_alpha_max               = 0.5   # max thermal exchange coefficient (no lipids)
phy_max_lipids_ref          = 80.0  # lipid reference for thermal insulation formula
phy_init_temperature        = 25.0  # initial body temperature (Celsius)
phy_opt_temperature         = 36.0  # optimal body temperature for respiration efficiency
phy_photo_min_elevation     = 50.0  # minimum cell elevation for light condition (photosynthesis)
phy_efficiency_half_range_c = 10.0  # respiration yield half-width and hot cutoff offset; reward uses continuous Gaussian yield

# -------------------------------------------------------
# New generation controls
# -------------------------------------------------------
newgen_enabled         = false  # controlled long run without periodic culling
newgen_interval_ticks  = 50000    # periodic trigger interval
newgen_survival_ratio  = 0.9    # was 0.35. Greater value is a loose natural selection [ratio of pop  kept after selection]
newgen_min_survivors   = 8       # lower bound for survivors

# Local weight mutation and temporal learning (applied at Start/Restart)
weight_mutation_rate = 0.05 # Probabilità di ritoccare solo il peso, se il gene non è stato sostituito
weight_mutation_step = 256 # Ampiezza massima del ritocco in quanti genetici (8192 quanti = peso 1)
learning_rate = 0.06 # Intensità della plasticità modulata dal vantaggio rispetto alla ricompensa recente
learning_trace_decay = 0.97 # Persistenza per tick delle tracce delle azioni eseguite; 0 = solo tick corrente
learning_baseline_rate = 0.01 # Velocità di aggiornamento della media recente della ricompensa

# Checkpoint resolved paths
nnets_dir = /pop_proj/data_out/nnets/
log_dir = /pop_proj/data_out/logs/
image_dir = /pop_proj/data_out/images/

learning_weight_decay = 0.00003 # Decadimento per tick sopra il minimo 1/8192
