# popx simulation configuration
# Lines starting with '#' are comments.
# Per-generation override syntax: key@N = value  (activates from generation N onwards)

# -------------------------------------------------------
# Neural network layer sizes
# -------------------------------------------------------
brain_size_s = 32       # sensor (input) layer width  — matches NUM_SENSES (5-bit gene field)
brain_size_n = 30       # hidden layer width (all hidden layers share this size)
brain_size_y = 30       # output layer width  — matches NUM_ACTIONS (17 actions, 17/32 ≈ 53% acceptance)
brain_num_hidden_layers = 4  # number of hidden layers (1-6)

# -------------------------------------------------------
# Simulation
# -------------------------------------------------------
population           = 20
steps_per_generation = 300
max_generations      = 200000
num_threads          = 4

# -------------------------------------------------------
# Genome
# -------------------------------------------------------
genome_min_length = 1000 
genome_max_length = 2000

# -------------------------------------------------------
# Mutation / reproduction
# -------------------------------------------------------
point_mutation_rate          = 0.2
gene_insertion_deletion_rate = 0.0
deletion_ratio               = 0.5
sexual_reproduction          = true
choose_parents_by_fitness    = true

# -------------------------------------------------------
# Output directories (relative to the build/run directory)
# -------------------------------------------------------
nnets_dir = ../data_out/nnets/
log_dir   = ../data_out/logs/
image_dir = ../data_out/images/
