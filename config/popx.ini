# popx simulation configuration
# Lines starting with '#' are comments.
# Per-generation override syntax: key@N = value  (activates from generation N onwards)

# -------------------------------------------------------
# Neural network layer sizes
# -------------------------------------------------------
brain_size_s = 32       # sensor (input) layer width  — matches NUM_SENSES (5-bit gene field)
brain_size_n = 30       # hidden layer width (all hidden layers share this size)
brain_size_y = 17       # output layer width  — matches NUM_ACTIONS (17 actions, 17/32 ≈ 53% acceptance)
brain_num_hidden_layers = 2  # number of hidden layers (1-6)

# -------------------------------------------------------
# Simulation
# -------------------------------------------------------
population           = 90
steps_per_generation = 300
max_generations      = 200000
num_threads          = 4

# -------------------------------------------------------
# Genome
# -------------------------------------------------------
genome_min_length = 50
genome_max_length = 5000

# -------------------------------------------------------
# Mutation / reproduction
# -------------------------------------------------------
point_mutation_rate          = 0.05
gene_insertion_deletion_rate = 0.0
deletion_ratio               = 0.5
sexual_reproduction          = true
choose_parents_by_fitness    = true
hebbian_inheritance          = true  # if true, offspring inherit Hebbian-learned weights

# -------------------------------------------------------
# Output directories (relative to the build/run directory)
# -------------------------------------------------------
nnets_dir = ../data_out/nnets/
log_dir   = ../data_out/logs/
image_dir = ../data_out/images/

# -------------------------------------------------------
# Physiology
# -------------------------------------------------------
phy_init_mitochondrions_max = 20     # max mitochondria count at init (random 1..N)
phy_init_chloroplasts_max   = 20      # max chloroplasts count at init (random 0..N)
phy_init_sensitiveness_max  = 6      # max sensitiveness at init (random 1..N)
phy_adipose_stock_max       = 80     # max lipid storage capacity
phy_min_chloroplasts        = 10      # minimum chloroplasts required for photosynthesis
phy_max_chloroplasts_ref    = 14      # reference for photosynthesis probability scaling
phy_energy_per_respiration  = 0.03   # energy gained per mitochondrion per cycle
phy_heat_per_respiration    = 0.3   # metabolism heat produced per mitochondrion per cycle
phy_alpha_min               = 0.01  # min thermal exchange coefficient (insulated by lipids)
phy_alpha_max               = 0.5   # max thermal exchange coefficient (no lipids)
phy_max_lipids_ref          = 80.0  # lipid reference for thermal insulation formula
phy_init_temperature        = 25.0  # initial body temperature (Celsius)
phy_photo_min_elevation     = 30.0  # minimum cell elevation for light condition (photosynthesis)

# -------------------------------------------------------
# New generation controls
# -------------------------------------------------------
newgen_enabled         = false   # if true, run natural selection periodically
newgen_interval_ticks  = 5000    # periodic trigger interval
newgen_survival_ratio  = 0.35    # top ratio kept after selection
newgen_min_survivors   = 8       # lower bound for survivors
